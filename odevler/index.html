        :root {
            --primary-color: #b208d1;
            --bg-color: #0f0c29;
            --text-color: #ffffff;
            --sidebar-bg: rgba(0, 0, 0, 0.4);
        }

        /* --- CURSOR --- */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .custom-cursor {
            width: 10px; height: 10px; background-color: var(--primary-color); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 99999;
            box-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--primary-color);
            transform: translate(-50%, -50%); transition: transform 0.05s linear;
        }
        .cursor-aura {
            width: 35px; height: 35px; border: 1px solid var(--primary-color); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 99998;
            box-shadow: 0 0 10px var(--primary-color);
            transform: translate(-50%, -50%); transition: transform 0.15s ease-out;
        }
        .cursor-active .custom-cursor { transform: translate(-50%, -50%) scale(2); background: white; }
        .cursor-active .cursor-aura { transform: translate(-50%, -50%) scale(1.5); border-color: white; opacity: 0.5; }

        /* --- NAVİGASYON (Orijinal Tasarım) --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 1000; height: 80px;
        }
        .logo { font-size: 2rem; font-weight: bold; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px; }
        nav ul { display: flex; list-style: none; flex-wrap: wrap; }
        nav ul li { margin-left: 20px; }
        .nav-btn {
            text-decoration: none !important; color: white !important; font-size: 1.2rem;
            font-weight: 500; padding: 10px; transition: color 0.3s, text-shadow 0.3s; display: inline-block;
        }
        .nav-btn:hover { color: var(--primary-color) !important; text-shadow: 0 0 10px var(--primary-color); }

        /* --- ANA İÇERİK --- */
        main { flex: 1; padding: 60px 20px; width: 100%; max-width: 1300px; margin: 0 auto; }
        .page-content { animation: fadeIn 0.4s ease-in-out; text-align: center; }
        h1 { font-size: 3.5rem; color: var(--primary-color); margin-bottom: 40px; }
        
        .ders-btn {
            display: flex; align-items: center; gap: 20px; width: 100%; padding: 25px; margin: 20px 0;
            background: rgba(255, 255, 255, 0.1); color: white; font-size: 1.4rem; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px; cursor: pointer; transition: 0.2s; text-align: left;
        }
        .ders-btn:hover { background: var(--primary-color); transform: translateX(10px); color: #fff; }

        .back-btn {
            background: #d63031; color: white; border: none; padding: 12px 25px; border-radius: 8px;
            cursor: pointer; font-size: 1.1rem; margin-bottom: 25px; display: inline-flex; align-items: center; gap: 10px;
        }

        /* --- WEBQUEST KUTUSU --- */
        .webquest-container {
            display: flex; gap: 20px; text-align: left; margin-top: 20px;
            min-height: 800px; background: rgba(0, 0, 0, 0.3); border-radius: 15px; overflow: hidden;
            border: 1px solid var(--primary-color);
        }

        .webquest-sidebar {
            width: 280px; background: var(--sidebar-bg); padding: 20px;
            border-right: 1px solid var(--primary-color);
        }

        .webquest-nav-btn {
            width: 100%; padding: 15px; margin-bottom: 10px; background: transparent;
            color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
            text-align: left; transition: 0.3s; font-size: 1.1rem; font-weight: bold;
        }

        .webquest-nav-btn:hover, .webquest-nav-btn.active {
            background: var(--primary-color); color: white; transform: scale(1.05);
        }

        /* WEBQUEST İÇERİK PUNTO AYARI (1.5 KAT BÜYÜTÜLMÜŞ) */
        .webquest-content { flex: 1; padding: 50px; overflow-y: auto; background: rgba(0,0,0,0.2); }
        .webquest-section { display: none; animation: fadeIn 0.3s; }
        .webquest-section.active { display: block; }
        
        .webquest-content p, .webquest-content li { font-size: 1.9rem; line-height: 1.6; margin-bottom: 35px; color: #fff; }
        .webquest-content h3 { font-size: 3.3rem; color: var(--primary-color); margin-bottom: 40px; border-bottom: 3px solid var(--primary-color); display: inline-block; }
        
        /* Kalın Başlıklar */
        .bold-header { font-weight: 900; color: var(--primary-color); }

        /* Süreç Maddeleri Arası Boşluk */
        .wq-step { margin-bottom: 60px; }

        /* Değerlendirme Tablosu (Tam Metin) */
        .wq-table { width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 1.4rem; }
        .wq-table th, .wq-table td { border: 1px solid rgba(255,255,255,0.2); padding: 25px; text-align: left; }
        .wq-table th { background: var(--primary-color); color: white; }

        /* Çark */
        #wheel-container { display: flex; flex-direction: column; align-items: center; margin-top: 40px; }
        #wheel-wrapper { position: relative; width: 400px; height: 400px; }
        #wheel-pointer {
            width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-top: 40px solid var(--primary-color); position: absolute;
            top: -15px; left: 50%; transform: translateX(-50%); z-index: 10;
        }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 30px rgba(178, 8, 209, 0.3); }

        @media (max-width: 1000px) {
            .webquest-container { flex-direction: column; }
            .webquest-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--primary-color); }
            .webquest-content p, .webquest-content li { font-size: 1.6rem; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

<html lang="tr">
<head>

       SOL PANEL - DOĞA TEMASI

    /* =========================================
       HARİTA ÜZERİNDEKİ PİMLER
       ========================================= */

    .pin {
      position: absolute;

      /* Öncekinden biraz daha küçük ve temiz */
      width: 34px;
      height: 34px;

      background-color: var(--earth-dark);
      color: #fff;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 700;
      font-size: 1.05rem;

      box-shadow: 0 4px 8px rgba(0,0,0,0.4);

      cursor: pointer;

      border: 3px solid #fff;

      /* Koordinatın tam merkezine oturtur */
      transform: translate(-50%, -50%);

      transition:
        transform 0.2s,
        background-color 0.2s;
    }

    .pin:hover {
      transform: translate(-50%, -50%) scale(1.25);
    }

    .pin.active {
      background-color: #f57c00;
      animation: pulse 0.8s infinite alternate;
      z-index: 5;
    }

    .pin.correct {
      background-color: var(--forest-green);
      cursor: default;
    }

    @keyframes pulse {
      from {
        transform: translate(-50%, -50%) scale(1);
      }

      to {
        transform: translate(-50%, -50%) scale(1.3);
      }
    }

    /* =========================================
       CEVAP MODALI
       ========================================= */

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      background: rgba(44, 29, 17, 0.6);
      backdrop-filter: blur(4px);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 100;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);

      padding: 30px;
      border-radius: 16px;

      width: 380px;

      border: 3px solid var(--earth-main);

      box-shadow: 0 10px 25px rgba(0,0,0,0.3);

      text-align: center;

      transform: translateY(-20px);

      transition: transform 0.3s ease;
    }

    .modal-overlay.open .modal-card {
      transform: translateY(0);
    }

    .modal-card h3 {
      color: var(--earth-dark);
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .modal-card input {
      width: 100%;

      padding: 12px;

      font-size: 1.1rem;

      border: 2px solid var(--earth-main);
      border-radius: 8px;

      margin-bottom: 20px;

      outline: none;

    .modal-card input:focus {

    .modal-buttons {

       DAHA KÜÇÜK EKRANLAR
       ========================================= */

    @media (max-width: 900px) {
      .sidebar {
        width: 280px;
      }

      h2 {
        font-size: 1.25rem;
      }

      .pin {
        width: 32px;
        height: 32px;
        font-size: 1rem;
      }
    }
  </style>
</head>

      document.querySelectorAll('.pin');

    const modalOverlay =

      document.getElementById('answerInput');

    const cancelBtn =

    // =========================================
    // OYUN SESLERİ
    // Web Audio API ile doğrudan üretilir; harici MP3 gerekmez.
    // =========================================

    let audioContext = null;

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function playTone(frequency, duration, type = 'sine', volume = 0.06, delay = 0) {
      const ctx = getAudioContext();
      const now = ctx.currentTime + delay;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.02);
    }

    function playSuccessSound() {
      playTone(523.25, 0.12, 'sine', 0.055);
      playTone(659.25, 0.16, 'sine', 0.055, 0.08);
      playTone(783.99, 0.20, 'sine', 0.045, 0.17);
    }

    function playWrongSound() {
      playTone(220, 0.16, 'triangle', 0.055);
      playTone(165, 0.22, 'triangle', 0.045, 0.11);
    }

    function playVictorySound() {
      playTone(523.25, 0.16, 'sine', 0.06);
      playTone(659.25, 0.16, 'sine', 0.06, 0.13);
      playTone(783.99, 0.18, 'sine', 0.06, 0.26);
      playTone(1046.50, 0.42, 'sine', 0.07, 0.40);
    }


    // =========================================
    // ŞANSINI DENE
    // =========================================

    drawBtn.addEventListener('click', () => {

      // Tüm dağlar tamamlandıysa

      if (completedNumbers.length === 11) {

        showStatus(
          "Tebrikler! Tüm dağları tamamladınız!",
          "success"
        );

        return;
      }


      // Henüz cevaplanmamış numaraları bul

      let availableNumbers = [];


      for (let i = 1; i <= 11; i++) {

        if (!completedNumbers.includes(i)) {

          availableNumbers.push(i);

        }

      }


      // Rastgele numara seç

      const randomIndex =
        Math.floor(
          Math.random() * availableNumbers.length
        );


      drawnNumber =
        availableNumbers[randomIndex];


      // Sol panelde numarayı göster

      numDisplay.innerText =
        drawnNumber;


      // Kullanıcıya mesaj göster

      showStatus(
        `${drawnNumber} numaralı dağın üzerine tıklayınız.`,
        "info"
      );


      // Pimlerin aktif durumunu güncelle

      pins.forEach(pin => {

        if (
          parseInt(pin.dataset.id) === drawnNumber
        ) {

          pin.classList.add('active');

        } else {

          pin.classList.remove('active');

        }

      });

    });


    // =========================================
    // PİME TIKLAMA
    // =========================================

    pins.forEach(pin => {

      pin.addEventListener('click', function() {

        const pinId =
          parseInt(this.dataset.id);


        // Daha önce tamamlanmış mı?

        if (
          completedNumbers.includes(pinId)
        ) {

          showStatus(
            "Bu dağın cevabını zaten bildiniz!",
            "info"
          );

          return;
        }


        // Önce numara çekilmiş mi?

        if (drawnNumber === null) {

          showStatus(
            "Lütfen önce zar butonuna tıklayınız.",
            "error"
          );

          return;
        }


        // Yanlış pime basıldıysa

        if (pinId !== drawnNumber) {

          showStatus(
            `Lütfen ${drawnNumber} numaralı butona tıklayınız.`,
            "error"
          );

          return;
        }


        // Doğru pime basıldı

        selectedPinId =
          pinId;


        openModal(pinId);

      });

    });


    // =========================================
    // MODAL AÇ
    // =========================================

    function openModal(pinId) {

      modalTitle.innerText =
        `${pinId} Numaralı Dağın Adı Nedir?`;


      answerInput.value = "";


      modalOverlay.classList.add('open');


      setTimeout(() => {

        answerInput.focus();

      }, 100);

    }


    // =========================================
    // MODAL KAPAT
    // =========================================

    function closeModal() {

      modalOverlay.classList.remove('open');

    }


    // İptal

    cancelBtn.addEventListener(
      'click',
      closeModal
    );


    // =========================================
    // CEVAP GÖNDER
    // =========================================

    submitBtn.addEventListener(
      'click',
      checkAnswer
    );


    // Enter ile cevaplama

    answerInput.addEventListener(
      'keypress',
      (e) => {

        if (e.key === 'Enter') {

          checkAnswer();

        }

      }
    );


    // =========================================
    // CEVABI KONTROL ET
    // =========================================

    function checkAnswer() {

      const userAnswer =
        answerInput.value
          .trim()
          .toLowerCase();


      const correctList =
        answers[selectedPinId] || [];


      // Doğru cevap

      if (
        correctList.includes(userAnswer)
      ) {

        showStatus(
          `Tebrikler!`,
          "success"
        );


        // Doğru pini bul

        const pin =
          document.querySelector(
            `.pin[data-id="${selectedPinId}"]`
          );


        // Aktif animasyonu kaldır

        pin.classList.remove('active');


        // Doğru durumuna getir

        pin.classList.add('correct');


        // Tamamlananlara ekle

        completedNumbers.push(
          selectedPinId
        );


        // Yeni numara çekilmesini bekle

        drawnNumber = null;


        numDisplay.innerText = "-";


        // Modalı kapat

        closeModal();


        // Final sorusunda normal doğru sesi yerine yalnızca zafer sesi çalınır.
        if (completedNumbers.length !== 11) {
          playSuccessSound();
        }


        // =====================================
        // OYUN BİTTİ Mİ?
        // =====================================

        if (
          completedNumbers.length === 11
        ) {

          showStatus(
            "Harika! Tüm dağları başarıyla bildiniz! 🏆",
            "success"
          );


          playVictorySound();

        }

      } else {

        // Yanlış cevap

        showStatus(
          "Yanlış",
          "error"
        );

        playWrongSound();

        closeModal();

      }

    }


    // =========================================
    // DURUM MESAJI
    // =========================================

    function showStatus(text, type) {

      statusMsg.innerText =
        text;


      statusMsg.className =
        `status-msg ${type}`;

    }

  </script>

</body>
</html>
