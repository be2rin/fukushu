<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE2RİN | Ödevler</title>
    <link rel="icon" type="image/png" href="../kan.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #b208d1;
            --bg-color: #0f0c29;
            --text-color: #ffffff;
            --sidebar-bg: rgba(0, 0, 0, 0.4);
        }

        /* --- CURSOR --- */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .custom-cursor {
            width: 10px; height: 10px; background-color: var(--primary-color); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 99999;
            box-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--primary-color);
            transform: translate(-50%, -50%); transition: transform 0.05s linear;
        }
        .cursor-aura {
            width: 35px; height: 35px; border: 1px solid var(--primary-color); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 99998;
            box-shadow: 0 0 10px var(--primary-color);
            transform: translate(-50%, -50%); transition: transform 0.15s ease-out;
        }
        .cursor-active .custom-cursor { transform: translate(-50%, -50%) scale(2); background: white; }
        .cursor-active .cursor-aura { transform: translate(-50%, -50%) scale(1.5); border-color: white; opacity: 0.5; }

        /* --- NAVİGASYON (Orijinal Tasarım) --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 1000; height: 80px;
        }
        .logo { font-size: 2rem; font-weight: bold; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px; }
        nav ul { display: flex; list-style: none; flex-wrap: wrap; }
        nav ul li { margin-left: 20px; }
        .nav-btn {
            text-decoration: none !important; color: white !important; font-size: 1.2rem;
            font-weight: 500; padding: 10px; transition: color 0.3s, text-shadow 0.3s; display: inline-block;
        }
        .nav-btn:hover { color: var(--primary-color) !important; text-shadow: 0 0 10px var(--primary-color); }

        /* --- ANA İÇERİK --- */
        main { flex: 1; padding: 60px 20px; width: 100%; max-width: 1300px; margin: 0 auto; }
        .page-content { animation: fadeIn 0.4s ease-in-out; text-align: center; }
        h1 { font-size: 3.5rem; color: var(--primary-color); margin-bottom: 40px; }
        
        .ders-btn {
            display: flex; align-items: center; gap: 20px; width: 100%; padding: 25px; margin: 20px 0;
            background: rgba(255, 255, 255, 0.1); color: white; font-size: 1.4rem; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px; cursor: pointer; transition: 0.2s; text-align: left;
        }
        .ders-btn:hover { background: var(--primary-color); transform: translateX(10px); color: #fff; }

        .back-btn {
            background: #d63031; color: white; border: none; padding: 12px 25px; border-radius: 8px;
            cursor: pointer; font-size: 1.1rem; margin-bottom: 25px; display: inline-flex; align-items: center; gap: 10px;
        }

        /* --- WEBQUEST KUTUSU --- */
        .webquest-container {
            display: flex; gap: 20px; text-align: left; margin-top: 20px;
            min-height: 800px; background: rgba(0, 0, 0, 0.3); border-radius: 15px; overflow: hidden;
            border: 1px solid var(--primary-color);
        }

        .webquest-sidebar {
            width: 280px; background: var(--sidebar-bg); padding: 20px;
            border-right: 1px solid var(--primary-color);
        }

        .webquest-nav-btn {
            width: 100%; padding: 15px; margin-bottom: 10px; background: transparent;
            color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
            text-align: left; transition: 0.3s; font-size: 1.1rem; font-weight: bold;
        }

        .webquest-nav-btn:hover, .webquest-nav-btn.active {
            background: var(--primary-color); color: white; transform: scale(1.05);
        }

        /* WEBQUEST İÇERİK PUNTO AYARI (1.5 KAT BÜYÜTÜLMÜŞ) */
        .webquest-content { flex: 1; padding: 50px; overflow-y: auto; background: rgba(0,0,0,0.2); }
        .webquest-section { display: none; animation: fadeIn 0.3s; }
        .webquest-section.active { display: block; }
        
        .webquest-content p, .webquest-content li { font-size: 1.9rem; line-height: 1.6; margin-bottom: 35px; color: #fff; }
        .webquest-content h3 { font-size: 3.3rem; color: var(--primary-color); margin-bottom: 40px; border-bottom: 3px solid var(--primary-color); display: inline-block; }
        
        /* Kalın Başlıklar */
        .bold-header { font-weight: 900; color: var(--primary-color); }

        /* Süreç Maddeleri Arası Boşluk */
        .wq-step { margin-bottom: 60px; }

        /* Değerlendirme Tablosu (Tam Metin) */
        .wq-table { width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 1.4rem; }
        .wq-table th, .wq-table td { border: 1px solid rgba(255,255,255,0.2); padding: 25px; text-align: left; }
        .wq-table th { background: var(--primary-color); color: white; }

        /* Çark */
        #wheel-container { display: flex; flex-direction: column; align-items: center; margin-top: 40px; }
        #wheel-wrapper { position: relative; width: 400px; height: 400px; }
        #wheel-pointer {
            width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-top: 40px solid var(--primary-color); position: absolute;
            top: -15px; left: 50%; transform: translateX(-50%); z-index: 10;
        }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 30px rgba(178, 8, 209, 0.3); }

        @media (max-width: 1000px) {
            .webquest-container { flex-direction: column; }
            .webquest-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--primary-color); }
            .webquest-content p, .webquest-content li { font-size: 1.6rem; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="cursor-aura"></div>

        </ul>
    </nav>
